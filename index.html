<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: url("Space_background.jpeg") center / cover fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }

        .card {
    width: 100%;
    max-width: 420px;
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
}

.card-banner {
    display: block;
    width: 100%;
    height: auto;
}

.card-body {
    padding: 32px;
}   
        h1 {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1a1a;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            color: #1a1a1a;
            background-color: #fafafa;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #1a1a1a;
            background-color: #ffffff;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        input[type="button"] {
            flex: 1 1 auto;
            padding: 9px 14px;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #333333;
        }

        #user_input + input[type="button"] {
            width: 100%;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        #user_input + input[type="button"]:hover {
            background-color: #f0f0f0;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            min-height: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 15px;
            color: #1a1a1a;
        }

        form {
            margin: 0;
        }
    </style>
</head>
<body>
<body>
    <div class="card">
        <img src="Seatwork_Banner.png" alt="Seatwork banner" class="card-banner">

        <div class="card-body">
            <header>
                <h1>O.B Montessori Aerospace club</h1>
            </header>
            <h2>Candidate Verification</h2>

            <input type="text" id="first_name" placeholder="First Name">
            <input type="text" id="last_name" placeholder="Last Name">
            <input type="button" py-click="verify_candidate" value="Verify">

            <div id="result"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</body>
</html>
